{% extends "base.html" %}
{% block title %}算法对比 · RL4CO Studio{% endblock %}
{% block head %}<link rel="stylesheet" href="/static/css/benchmark.css">{% endblock %}
{% block content %}
<div class="page-heading"><div><h1>算法对比</h1><p>选择真实实验，比较指标；也可查看原项目论文基准。</p></div><button type="button" class="btn" id="benchmark-refresh">刷新数据</button></div>
<div class="page-stack"><section class="card"><div class="benchmark-filters"><div class="field"><label for="benchmark-source">数据来源</label><select id="benchmark-source"><option value="experiments">我的训练实验</option><option value="reference">论文基准（原项目数据）</option></select></div><div class="field"><label for="problem-select">问题类型</label><select id="problem-select"></select></div><div class="field"><label for="node-select">规模 / 数据集</label><select id="node-select"></select></div><div class="field"><label for="metric-select">Metric</label><select id="metric-select"></select></div><div class="field" id="benchmark-category-field" hidden><label for="category-select">解码方法</label><select id="category-select"><option value="Greedy">Greedy One Shot</option><option value="Sampling">Sampling</option><option value="Multistart">Multistart</option><option value="Augmentation">Augmentation</option><option value="Multistart_Aug">Multistart + Aug</option><option value="Classical">Classical</option><option value="all">全部方法</option></select></div></div><div id="experiment-picker" class="experiment-picker"></div><div class="banner" id="benchmark-note" role="status"></div></section>
<div id="benchmark-feedback"></div><div class="metric-grid" id="benchmark-metrics"><div class="metric-card"><div class="metric-label">选择数量</div><div id="compare-count" class="metric-value">—</div></div><div class="metric-card"><div class="metric-label" id="best-label">当前最佳</div><div id="best-method" class="metric-value">—</div></div><div class="metric-card"><div class="metric-label">最佳指标值</div><div id="best-value" class="metric-value">—</div></div><div class="metric-card"><div class="metric-label">平均指标值</div><div id="average-value" class="metric-value">—</div></div></div>
<section class="card" id="benchmark-chart-card"><div class="card-header"><h2>性能概览</h2><span class="badge" id="benchmark-source-label"></span></div><div class="chart" id="mainChart" role="img" aria-label="所选实验或论文基准的性能对比"></div><p id="benchmark-chart-summary" class="chart-caption"></p></section>
<section class="card"><div class="card-header"><h2>详细指标</h2><button type="button" id="benchmark-export" class="btn btn-small">导出 CSV</button></div><div class="table-scroll" id="benchmark-table"></div></section></div>
{% endblock %}{% block scripts %}<script src="/static/vendor/echarts.min.js"></script><script src="/static/js/charts.js"></script><script src="/static/js/benchmark.js"></script>{% endblock %}
