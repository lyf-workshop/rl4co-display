{% extends "base.html" %}
{% block title %}文件与数据 · RL4CO Studio{% endblock %}
{% block head %}<link rel="stylesheet" href="/static/css/files.css">{% endblock %}
{% block content %}
<div class="page-heading"><div><h1>文件与数据</h1><p>管理数据集、训练产物与模型 Checkpoint。</p></div><div class="actions"><button type="button" id="files-refresh" class="btn">刷新</button><button type="button" id="files-clear" class="btn btn-danger">清空训练产物</button></div></div>
<div class="page-stack"><div class="metric-grid"><div class="metric-card"><div class="metric-label">数据集</div><div id="dataset-count" class="metric-value">—</div></div><div class="metric-card"><div class="metric-label">训练结果文件</div><div id="result-count" class="metric-value">—</div></div><div class="metric-card"><div class="metric-label">Checkpoint</div><div id="checkpoint-count" class="metric-value">—</div></div><div class="metric-card"><div class="metric-label">存储占用</div><div id="storage-count" class="metric-value">—</div><div class="metric-note">数据集与训练产物</div></div></div>
<section class="card"><div class="tabs" role="tablist" aria-label="文件类型"><button type="button" role="tab" id="tab-datasets" aria-controls="panel-datasets" aria-selected="true" data-tab="datasets">数据集</button><button type="button" role="tab" id="tab-results" aria-controls="panel-results" aria-selected="false" data-tab="results" tabindex="-1">训练结果</button><button type="button" role="tab" id="tab-checkpoints" aria-controls="panel-checkpoints" aria-selected="false" data-tab="checkpoints" tabindex="-1">Checkpoint</button></div>
<div id="panel-datasets" role="tabpanel" aria-labelledby="tab-datasets"><details class="upload-panel" open><summary>上传数据集</summary><form id="files-upload-form" class="upload-fields"><div class="field"><label for="upload-problem">问题类型</label><select id="upload-problem" name="problem_type"><option value="tsp">TSP</option><option value="cvrp">CVRP</option><option value="sdvrp">SDVRP</option><option value="vrptw">VRPTW</option><option value="mtsp">mTSP</option><option value="pdp">PDP</option><option value="op">OP</option><option value="pctsp">PCTSP</option><option value="spctsp">SPCTSP</option></select></div><div class="field"><label for="upload-file">数据文件</label><input type="file" id="upload-file" name="dataset" accept=".json,.txt,.tsp" required><p class="description">单文件最多 5 MB · 格式取决于问题类型。</p></div><button type="submit" class="btn btn-primary" id="files-upload">上传数据集</button></form><div id="files-upload-status" class="banner" role="status" hidden></div></details><div id="datasets-table" class="table-scroll"></div></div>
<div id="panel-results" role="tabpanel" aria-labelledby="tab-results" hidden><div id="results-table"></div></div>
<div id="panel-checkpoints" role="tabpanel" aria-labelledby="tab-checkpoints" hidden><div id="checkpoints-table" class="table-scroll"></div></div></section></div>
{% endblock %}{% block scripts %}<script src="/static/js/file-manager.js"></script>{% endblock %}
