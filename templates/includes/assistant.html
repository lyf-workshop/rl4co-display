<div id="assistant-layer" class="drawer-overlay" hidden>
<aside class="ai-chat-panel-embedded" role="dialog" aria-modal="true" aria-labelledby="assistant-title" tabindex="-1">
  <div class="ai-chat-header"><div><h2 id="assistant-title">RL4CO 助手</h2><p class="description">结合当前实验，讨论训练与调参。</p></div><div class="actions"><button type="button" class="btn btn-icon" id="ai-clear-btn" aria-label="清空对话">{{ icon('files') }}</button><button type="button" class="btn btn-icon" id="assistant-close" aria-label="关闭 AI 助手">{{ icon('close') }}</button></div></div>
  <div class="ai-selector-bar"><div class="field"><label for="ai-source-select">服务来源</label><select id="ai-source-select"><option value="ollama">本地 Ollama</option></select></div><div class="field"><label for="ai-model-select">模型</label><select id="ai-model-select"><option value="">加载中…</option></select></div></div>
  <div id="ai-model-status" class="ai-model-status" role="status"><span class="status-dot"></span><span class="status-text"></span><button type="button" id="assistant-retry" class="btn btn-small">重试连接</button></div>
  <div class="assistant-context"><span class="description">当前实验上下文</span><div id="assistant-context" class="data"></div></div>
  <div class="ai-chat-messages" id="ai-chat-messages" role="log" aria-live="polite"><div class="ai-chat-empty empty-state"><h3>从当前实验开始</h3><p>提问后，助手将通过所选服务生成回答。</p></div></div>
  <div class="assistant-quick actions"><button type="button" class="btn btn-small" data-prompt="解释当前 Loss 的变化，并说明哪些现象值得关注。">解释当前 Loss</button><button type="button" class="btn btn-small" data-prompt="根据当前实验配置和训练指标，给出调参建议。">给出调参建议</button><button type="button" class="btn btn-small" data-prompt="检查当前配置和指标是否存在异常，说明判断依据。">检查异常</button><button type="button" class="btn btn-small" id="assistant-cancel" hidden>停止生成</button><button type="button" class="btn btn-small" id="assistant-message-retry" hidden>重试上次请求</button></div>
  <div class="ai-chat-input-container"><label for="ai-chat-input" class="sr-only">发送给助手的消息</label><div class="ai-chat-input-wrapper"><textarea id="ai-chat-input" class="ai-chat-input" rows="2" placeholder="输入问题…"></textarea><button type="button" class="btn btn-primary" id="ai-send-btn" aria-label="发送消息">{{ icon('arrow') }}</button></div><p class="description">Enter 发送 · Shift+Enter 换行</p></div>
</aside></div>
